<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/nikhjoshi123/ai-fitting-labs-site/a2d46d836c5139a1d8faf39d067685bd0ed72f2f/ai-fitting-labs-logo.jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync | AI FITTING LABS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --dark: #050505; }
        body { background-color: var(--dark); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .lux-font { font-family: 'Playfair Display', serif; }
        
        /* RAINBOW LOGO */
        .rainbow-text {
            background: linear-gradient(to right, #ef4444, #f59e0b, #10b981, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-move 5s linear infinite;
            background-size: 200% auto;
        }
        @keyframes rainbow-move { to { background-position: 200% center; } }

        .text-gold-gradient { color: var(--gold); background: linear-gradient(to bottom, #f1d18a, #c5a059); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .booking-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            backdrop-filter: blur(20px);
            min-height: 700px;
        }

        .nav-link { font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; color: #888; transition: all 0.3s; }
        .nav-link:hover { color: white; }
    </style>
</head>
<body>

    <nav class="fixed w-full z-[100] px-10 py-8 flex justify-between items-center bg-black/40 backdrop-blur-xl border-b border-white/5">
        <div class="lux-font text-xl uppercase tracking-tighter font-bold">
            <span class="rainbow-text">AI FITTING LABS</span>
        </div>
        <div class="hidden md:flex gap-10">
            <a href="index.html" class="nav-link">Home</a>
            <a href="pricing.html" class="nav-link">Pricing</a>
            <a href="mission.html" class="nav-link">Mission</a>
        </div>
    </nav>

    <section class="pt-40 pb-20 px-6 max-w-5xl mx-auto">
        <div class="text-center mb-12">
            <span class="text-gold font-bold text-[10px] tracking-[0.6em] uppercase block mb-4">Request Access</span>
            <h1 class="lux-font text-5xl md:text-6xl italic text-gold-gradient mb-4">Architectural Sync</h1>
            <p class="text-gray-500 uppercase text-[9px] tracking-[0.4em] max-w-md mx-auto leading-relaxed">
                Connect with our tech team to verify your brand's AI compatibility.
            </p>
        </div>

        <div class="booking-container shadow-2xl">
            <div class="calendly-inline-widget" 
                 data-url="https://calendly.com/nhjoshi436/15min?hide_event_type_details=1&hide_gdpr_banner=1&background_color=050505&text_color=ffffff&primary_color=c5a059" 
                 style="min-width:320px;height:700px;">
            </div>
            <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
        </div>
    </section>

    <footer class="py-10 text-center border-t border-white/5 opacity-50">
        <p class="text-[8px] uppercase tracking-widest text-gray-500">AI FITTING LABS | Secure Server Sync</p>
    </footer>

</body>
</html>
