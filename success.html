<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Complete | AI FITTING LABS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: screen; }
        .scanner { width: 300px; height: 2px; background: #c5a059; position: absolute; box-shadow: 0 0 20px #c5a059; animation: scan 2s infinite; }
        @keyframes scan { 0% { top: 30%; } 50% { top: 70%; } 100% { top: 30%; } }
        .hidden-content { opacity: 0; animation: fadeIn 1s forwards 2.5s; }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body class="h-screen overflow-hidden">

    <div id="loader" class="flex flex-col items-center">
        <div class="scanner"></div>
        <p class="mt-10 text-xs tracking-[0.5em] uppercase text-gray-500 animate-pulse">Analyzing Brand Assets...</p>
    </div>

    <div class="hidden-content text-center px-6">
        <h1 class="text-4xl italic font-serif mb-4 text-[#c5a059]">Sync Reserved.</h1>
        <div class="bg-white/5 border border-white/10 p-8 rounded-3xl mb-6">
            <p class="text-[10px] uppercase tracking-widest text-gray-400 mb-2">Unique Session ID</p>
            <h2 class="text-3xl font-mono font-bold tracking-tighter text-white">AIFL-4092-B</h2>
        </div>
        <p class="text-gray-500 text-sm max-w-xs mx-auto mb-8">
            Your environment is being prepared. Check your inbox for the encrypted Zoom link.
        </p>
        <a href="index.html" class="text-[10px] border-b border-gold text-gold uppercase tracking-widest">Back to Lab</a>
    </div>

    <script>
        // Hide loader after 2.5 seconds
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
        }, 2500);
    </script>
</body>
</html>
