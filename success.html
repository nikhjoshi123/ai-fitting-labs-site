<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/nikhjoshi123/ai-fitting-labs-site/a2d46d836c5139a1d8faf39d067685bd0ed72f2f/ai-fitting-labs-logo.jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed | AI FITTING LABS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --dark: #050505; }
        body { background-color: var(--dark); color: #fff; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .lux-font { font-family: 'Playfair Display', serif; }
        
        .rainbow-text {
            background: linear-gradient(to right, #ef4444, #f59e0b, #10b981, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-move 5s linear infinite;
            background-size: 200% auto;
        }
        @keyframes rainbow-move { to { background-position: 200% center; } }

        .confirmation-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body>

  <div class="confirmation-card p-10 md:p-16 shadow-2xl border border-white/10">
    <div class="mb-8">
        <div class="w-20 h-20 bg-emerald-500/10 border border-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="text-emerald-500 text-3xl">✓</span>
        </div>
        <h1 class="lux-font text-3xl italic text-[#c5a059] mb-4">Verification Successful</h1>
        <p class="text-gray-400 text-sm leading-relaxed font-light mb-6">
            Your brand synchronization request has been processed.
        </p>
    </div>

    <div class="bg-white/5 border border-white/10 p-6 rounded-2xl mb-8">
        <p class="text-[9px] uppercase tracking-[0.3em] text-gray-500 mb-2">Unique Session Access Key</p>
        <h2 id="session-id" class="text-2xl font-mono font-bold tracking-widest text-white">AFL-</h2>
    </div>

    <div class="space-y-4">
        <p class="text-emerald-500 text-[10px] font-bold uppercase tracking-[0.2em] animate-pulse">
            📩 Confirmation Sent to Inbox
        </p>
        <p class="text-gray-500 text-[10px] uppercase tracking-widest leading-loose">
            Check your Gmail for the <br> <span class="text-white italic">Encrypted Zoom Entrance Link</span>
        </p>
    </div>
</div>

<script>
    // Logic to generate a realistic ID (e.g., AFL-482)
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const randomLetters = "AFL"; // Keeping your brand prefix
    const randomDigits = Math.floor(100 + Math.random() * 900);
    document.getElementById('session-id').innerText = randomLetters + "-" + randomDigits;
</script>
</body>
</html>
