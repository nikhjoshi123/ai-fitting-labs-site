<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/nikhjoshi123/ai-fitting-labs-site/a2d46d836c5139a1d8faf39d067685bd0ed72f2f/ai-fitting-labs-logo.jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed | AI FITTING LABS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --dark: #050505; }
        body { background-color: var(--dark); color: #fff; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .lux-font { font-family: 'Playfair Display', serif; }
        
        .rainbow-text {
            background: linear-gradient(to right, #ef4444, #f59e0b, #10b981, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-move 5s linear infinite;
            background-size: 200% auto;
        }
        @keyframes rainbow-move { to { background-position: 200% center; } }

        .confirmation-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body>

  <div class="confirmation-card p-10 md:p-16 shadow-2xl">
    <div class="mb-8">
        <div class="w-20 h-20 bg-emerald-500/10 border border-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="text-emerald-500 text-4xl">🔑</span>
        </div>
        <h1 class="lux-font text-3xl italic text-[#c5a059] mb-4">Access Granted.</h1>
        <p class="text-gray-400 text-sm leading-relaxed font-light">
            Your Session ID has been generated and synchronized with your email.
        </p>
    </div>

    <div class="bg-white/5 border border-white/10 p-4 rounded-xl mb-6">
        <p class="text-[9px] uppercase tracking-widest text-gray-500 mb-1">Reference ID</p>
        <p class="text-xl font-mono text-white">AIFL-SYNC-{{random_number}}</p> 
        </div>

    <p class="text-emerald-500 text-[10px] font-bold uppercase tracking-widest animate-pulse">
        📩 Check your Gmail now
    </p>
</div>

        <div class="mt-12">
            <a href="index.html" class="text-[10px] uppercase tracking-[0.5em] text-gray-600 hover:text-white transition duration-500">
                ← Return to Lab
            </a>
        </div>
    </div>

</body>
</html>
